{% extends 'base.html' %}
{% block title %}Admin Portal Login - LocalBizMart{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card" style="border-top: 4px solid var(--accent);">
        <div class="card-header" style="justify-content: center; text-align: center;">
            <div>
                <div style="font-size: 2rem; margin-bottom: 0.5rem;">🛡️</div>
                <h2 class="card-title">Admin Management Portal</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Authorized staff & moderator access only</p>
            </div>
        </div>

        <form method="POST" action="{{ url_for('auth.admin_login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="email">Admin Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="admin@localbizmart.com" value="{{ email or '' }}" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Security Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary btn-block" style="background: var(--accent); border-color: var(--accent);">Authenticate Administrator</button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-muted);">
            Return to <a href="{{ url_for('browse.index') }}">Marketplace Home</a>
        </div>
    </div>
</div>
{% endblock %}
