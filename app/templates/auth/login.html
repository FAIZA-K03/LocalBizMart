{% extends 'base.html' %}
{% block title %}Login - LocalBizMart{% endblock %}
{% block content %}
<div style="max-width: 450px; margin: 2rem auto;">
    <div class="card">
        <div class="card-header" style="justify-content: center; text-align: center;">
            <div>
                <h2 class="card-title">Welcome Back</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to your customer or seller account</p>
            </div>
        </div>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" value="{{ email or '' }}" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('auth.register') }}" style="font-weight: 600;">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
