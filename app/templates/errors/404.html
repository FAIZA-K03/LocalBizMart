{% extends 'base.html' %}
{% block title %}Page Not Found (404) - LocalBizMart{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 3rem 2rem;">
    <h1 style="font-size: 4rem; color: var(--primary); line-height: 1;">404</h1>
    <h2 style="margin: 1rem 0; color: var(--text-main);">Page Not Found</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">
        The shop, product, or page you are looking for does not exist or may have been removed.
    </p>
    <div>
        <a href="{{ url_for('browse.index') }}" class="btn btn-primary">Browse Marketplace</a>
        <a href="{{ url_for('browse.businesses') }}" class="btn btn-secondary">View All Shops</a>
    </div>
</div>
{% endblock %}
