{% extends 'base.html' %}
{% block title %}Access Denied (403) - LocalBizMart{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 3rem 2rem;">
    <h1 style="font-size: 4rem; color: var(--danger); line-height: 1;">403</h1>
    <h2 style="margin: 1rem 0; color: var(--text-main);">Access Denied</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">
        You do not have the required permissions or role privileges to view this page.
    </p>
    <div>
        <a href="{{ url_for('browse.index') }}" class="btn btn-primary">Return to Home</a>
        <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">Switch Account</a>
    </div>
</div>
{% endblock %}
